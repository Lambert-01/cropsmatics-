name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version is taken from package.json > packageManager.
      # Do NOT also pass `with: version:` here - declaring it twice is what
      # made the action fail before the install step ran.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter cropmatics-web lint
      - run: pnpm --filter cropmatics-web typecheck
      - run: pnpm --filter cropmatics-web test
      - run: pnpm --filter cropmatics-web build

  mobile:
    name: Mobile (lint, typecheck, test, expo config)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      # apps/mobile is intentionally outside the pnpm workspace: Metro resolves
      # the app entry relative to apps/mobile, so it needs its own flat
      # node_modules. It is therefore installed with npm here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Expo configuration smoke check
        run: npx expo config --type public

  api:
    name: API (lint, test, canonical integration)
    runs-on: ubuntu-latest
    # A real PostgreSQL backs the canonical layer here. The unit tests stay
    # database-independent (conftest pins an unreachable DATABASE_URL), and the
    # integration suite is pointed at this throwaway container explicitly, so the
    # migrations, loader, idempotency, parity and inquiry storage are proven in CI
    # instead of being skipped by default.
    #
    # The image MUST ship PostGIS. The initial Alembic revision runs
    # `CREATE EXTENSION IF NOT EXISTS postgis` and declares geometry columns, so the
    # official `postgres:16` image fails `alembic upgrade head` with
    # `FeatureNotSupported: extension "postgis" is not available` and every test in
    # the canonical suite errors. This mirrors `docker-compose.yml`, which has always
    # used the PostGIS image, and production (Neon/Supabase are PostGIS-enabled).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cropmatics
          POSTGRES_PASSWORD: cropmatics
          POSTGRES_DB: cropmatics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropmatics -d cropmatics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANONICAL_TEST_DATABASE_URL: postgresql+psycopg://cropmatics:cropmatics@localhost:5432/cropmatics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r services/api/requirements-dev.txt
          pip install -r services/api/requirements-ml.txt
      # data/processed is gitignored, so every fresh checkout must rebuild the
      # analytical tables before the API tests can exercise real data paths.
      # Without this the tests that need them either fail or skip vacuously.
      - name: Build analytical tables
        run: python scripts/data/run_all.py
      - name: Ruff
        run: ruff check services/api/app services/api/tests
      - name: Pytest (unit + canonical integration)
        env:
          JWT_SECRET: test-secret
        run: pytest services/api/tests --no-header -ra
      - name: Canonical integration proof
        # Run the database-backed suite on its own so a regression in migrations,
        # the loader or the canonical reads is legible in the log rather than
        # buried in the full run. The module fixtures apply `alembic upgrade head`
        # and run the loader against the container above.
        env:
          JWT_SECRET: test-secret
        run: pytest services/api/tests/test_canonical_integration.py --no-header -ra

  ml:
    name: ML (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r services/api/requirements.txt
          pip install -r services/api/requirements-ml.txt
          pip install -r services/api/requirements-dev.txt
      - name: Ruff
        run: ruff check ml/src ml/tests
      - name: Pytest
        run: pytest ml --no-header -ra

  data-pipeline:
    name: Data pipeline (validate + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/api/requirements-dev.txt
      - name: Ruff (data pipeline)
        run: ruff check scripts/data scripts/tests
      - run: python scripts/data/run_all.py
      - name: Ensure expected outputs exist
        run: |
          test -f data/processed/training_district_crop.csv
          test -f data/processed/national_postharvest_infrastructure.csv
          test -f data/processed/cold_chain_network_summary.csv
          test -f data/processed/manifest.json
          test -f data/interim/validation_report.json
          test -f data/interim/area_consistency_report.csv
      - name: Pytest (data pipeline)
        run: pytest scripts/tests --no-header -ra
      - name: Pipeline rebuild is idempotent
        # The canonical load verifies the dataset identity before it writes, so a
        # build whose identity depends on leftover working-tree state can never be
        # reconciled with a deploy. It did: the crop alias map was read from an
        # interim artefact a *later* step writes, so a pristine build and a second
        # build in the same tree produced different datasets from one commit. This
        # rebuilds the pipeline and fails if the content-addressed version moved.
        run: python scripts/data/check_idempotent_build.py
