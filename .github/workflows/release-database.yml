# Canonical database release step — manual, approval-gated, read-only by default.
#
# Why this workflow exists
# ------------------------
# The canonical load is a *release* step and must never run on a request or from
# the service's Start Command. The intended home for it is Render's Pre-Deploy
# Command, which `render.yaml` declares:
#
#     preDeployCommand: python /app/scripts/data/canonical_bootstrap.py
#
# Render documents that the pre-deploy command "is available for paid web
# services" (https://render.com/docs/deploys). The production service runs on the
# Free plan, so that step does not execute at all - which is why the canonical
# database was still serving a 2026-09-28 dataset while the image expected the
# current one, and why every canonical-backed analytics endpoint answered
# `503 DATASET_OUT_OF_SYNC`.
#
# Until the service is on a plan that supports a pre-deploy command, this is the
# secure alternative: a human-triggered release step that keeps migrations and
# the data load separate from request serving.
#
# Safety properties
# -----------------
#  1. **It is never automatic.** `workflow_dispatch` only, and the write is
#     gated behind typing APPLY into the input. The default is a dry run.
#  2. **It builds the dataset from the same commit the image was built from.**
#     The dataset identity is content-addressed, so the load must be derived from
#     the deployed commit - not from a developer's working tree. Pass the deploy
#     SHA in `commit` and the build is pinned to it.
#  3. **The confirmed target is verified, not just typed.** `confirm_target` is
#     compared against the hostname parsed from `PRODUCTION_DATABASE_URL`; a
#     mismatch aborts before anything is planned or written. (The production
#     database is itself named `cropmatics_ci_canonical_test` - confirmed from
#     the Render dashboard - so identity is gated on the exact host, not a
#     guessed database name.)
#  4. **Only commits on `main` can be released.** The checked-out commit must be
#     an ancestor of `origin/main` (or `main` itself), so a write-access user
#     cannot run unreviewed branch code against production.
#  5. **APPLY additionally requires an attestation** that a Neon restore point
#     exists and the load was rehearsed on an isolated branch.
#
# Required configuration (owner action, once):
#   * Secret `PRODUCTION_DATABASE_URL` — the Neon connection string, with
#     `?sslmode=require`. Server-side only; never a NEXT_PUBLIC_* EXPO_PUBLIC_* value.
#   * A `production-database` GitHub Environment with required reviewers, so an
#     approval is needed before the job starts. Without reviewers the typing
#     gates below are the only human check - configure them.
name: Release database (canonical sync)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the deployed image was built from (blank = the default branch HEAD)"
        required: false
        default: ""
      apply:
        description: "Type APPLY to load the canonical dataset. Anything else runs the plan only."
        required: true
        default: "DRY RUN"
      confirm_target:
        description: "Confirm the target database by typing its host exactly (e.g. ep-xxx-pooler.eu-central-1.aws.neon.tech)"
        required: true
      prerequisites_confirmed:
        description: "For APPLY: type BACKUP-AND-REHEARSAL-DONE after creating a Neon restore point and rehearsing the load on an isolated branch"
        required: false
        default: ""

concurrency:
  # A release step and a concurrent loader would race on the same tables.
  group: release-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Migrate, compare, load if changed, verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-database
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ancestry check below can prove the release
          # commit is on main rather than an arbitrary branch.
          fetch-depth: 0
          ref: ${{ inputs.commit != '' && inputs.commit || github.sha }}

      - name: Verify the release commit is on main
        # A write-access user can dispatch this workflow; without this check
        # they could point `commit` at any branch and run unreviewed code in a
        # job that holds the production database secret.
        run: |
          git fetch origin main
          SHA="$(git rev-parse HEAD)"
          MAIN="$(git rev-parse origin/main)"
          echo "checked-out commit: $SHA"
          echo "origin/main:        $MAIN"
          if [ "$SHA" = "$MAIN" ]; then
            echo "release commit is main HEAD: ok"
          elif git merge-base --is-ancestor "$SHA" origin/main; then
            echo "release commit is an ancestor of main: ok"
          else
            echo "ERROR: the release commit is not on main. Only main (or a commit already merged into main) may be released."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r services/api/requirements.txt

      - name: Verify the confirmed target matches the production connection
        # `confirm_target` used to be printed but never checked. It is now
        # compared against the hostname and database name parsed from the
        # production connection string. The input reaches the script through the
        # environment, never interpolated into the shell, so a crafted input
        # cannot execute commands in a job that holds the secret.
        #
        # The database name is reported for the record but is NOT hard-gated
        # against a fixed string: the production database is itself named
        # `cropmatics_ci_canonical_test` (verified from the Render dashboard's
        # DATABASE_URL), so a name-based refusal would block the real release.
        # The exact-host comparison below is the identity gate.
        env:
          TYPED_TARGET: ${{ inputs.confirm_target }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os
          import sys
          from urllib.parse import urlparse

          typed = (os.environ.get("TYPED_TARGET") or "").strip().lower()
          url = os.environ.get("DATABASE_URL") or ""
          if not url.strip():
              print("ERROR: the PRODUCTION_DATABASE_URL secret is not configured.")
              sys.exit(1)
          parsed = urlparse(url)
          host = (parsed.hostname or "").lower()
          database = (parsed.path or "/").lstrip("/")
          if not host:
              print("ERROR: could not parse a hostname from the production connection string.")
              sys.exit(1)
          if typed != host:
              print(f"ERROR: confirm_target {typed!r} does not match the production host {host!r}.")
              sys.exit(1)
          print(f"confirmed production target: host={host} database={database}")
          EOF

      - name: Build the processed dataset from this commit
        # data/processed is gitignored, so the release artefact must be built here.
        # Building it from the pinned commit is what makes the content-addressed
        # version match the image the database will be compared against; building
        # it from a warm working tree does not (see scripts/data/check_idempotent_build.py).
        run: python scripts/data/run_all.py

      - name: Report the release identity
        # No secrets: only the commit, the mode, and the dataset identity that
        # the build above produced.
        env:
          MODE: ${{ inputs.apply == 'APPLY' && 'APPLY (writes)' || 'DRY RUN (no writes)' }}
        run: |
          echo "checked-out commit: $(git rev-parse HEAD)"
          echo "mode:               $MODE"
          python - <<'EOF'
          import json
          import sys

          sys.path.insert(0, "services/api")
          from app.data.versioning import content_version

          manifest = json.load(open("data/processed/manifest.json"))
          print(f"expected version:   {content_version(manifest)}")
          print(f"expected rows:      {(manifest.get('row_counts') or {}).get('crop_productivity')}")
          EOF

      - name: "Plan — read-only: pending migrations, expected vs loaded version"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python scripts/data/canonical_bootstrap.py --dry-run

      - name: Require a restore point and rehearsal before writing
        # APPLY is refused unless the operator attests that a Neon restore
        # point exists and the load was rehearsed on an isolated branch.
        if: inputs.apply == 'APPLY'
        env:
          PREREQUISITES: ${{ inputs.prerequisites_confirmed }}
        run: |
          if [ "$PREREQUISITES" != "BACKUP-AND-REHEARSAL-DONE" ]; then
            echo "ERROR: APPLY requires prerequisites_confirmed=BACKUP-AND-REHEARSAL-DONE."
            echo "Create a Neon restore point, rehearse the load on an isolated branch, then re-run."
            exit 1
          fi

      - name: Apply the canonical load
        if: inputs.apply == 'APPLY'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python scripts/data/canonical_bootstrap.py

      - name: Verify the deployed API serves the expected dataset
        # The release is not done when the load returns: it is done when the
        # running service answers from the dataset this commit built. After an
        # APPLY this is the release gate. After a dry run the same probe runs
        # for information but cannot fail the plan - an out-of-sync production
        # is the state the plan exists to describe, not a plan malfunction.
        if: inputs.apply == 'APPLY'
        run: python scripts/verify_production.py

      - name: Report current production state (informational after a plan)
        if: inputs.apply != 'APPLY'
        continue-on-error: true
        run: python scripts/verify_production.py
